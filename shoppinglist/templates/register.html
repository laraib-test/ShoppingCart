{% extends "shoppinglist/base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="flex justify-center items-center min-h-[80vh]">

    <div class="card w-full max-w-xl bg-base-100 shadow-2xl">

        <div class="card-body p-10">

            <h2 class="text-4xl font-bold text-center mb-8">
                Create Account
            </h2>

            <form method="post">

                {% csrf_token %}

                <!-- Username -->
                <div class="form-control mb-5">

                    <label class="label">
                        <span class="label-text font-semibold">
                            Username
                        </span>
                    </label>

                    {{ form.username }}

                </div>

                <!-- Email -->
                <div class="form-control mb-5">

                    <label class="label">
                        <span class="label-text font-semibold">
                            Email
                        </span>
                    </label>

                    {{ form.email }}

                </div>

                <!-- Password -->
                <div class="form-control mb-5">

                    <label class="label">
                        <span class="label-text font-semibold">
                            Password
                        </span>
                    </label>

                    {{ form.password1 }}

                </div>

                <!-- Confirm Password -->
                <div class="form-control mb-8">

                    <label class="label">
                        <span class="label-text font-semibold">
                            Confirm Password
                        </span>
                    </label>

                    {{ form.password2 }}

                </div>

                <!-- Button -->
                <button
                    type="submit"
                    class="btn btn-primary w-full text-lg"
                >
                    Register
                </button>

            </form>

            <p class="text-center mt-6">

                Already have an account?

                <a
                    href="{% url 'login' %}"
                    class="text-primary font-semibold"
                >
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
