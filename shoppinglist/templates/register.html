<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            padding: 16px 40px;
            color: white;
        }

        .navbar h1 {
            font-size: 22px;
        }

        /* CENTER CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* REGISTER CARD */
        .register-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2575fc;
        }

        .errorlist {
            color: red;
            margin-bottom: 10px;
            list-style: none;
            font-size: 14px;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2575fc;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #1a5ed8;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .footer-text a {
            color: #2575fc;
            text-decoration: none;
        }

        /* FOOTER */
        footer {
            background: white;
            text-align: center;
            padding: 18px;
            border-top: 1px solid #ddd;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h1>Shopping App</h1>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="register-container">
            <h2>Create Account</h2>

            <form method="POST">
                {% csrf_token %}

                {{ form.non_field_errors }}

                <div class="form-group">
                    <label>Username</label>
                    {{ form.username }}
                </div>

                <div class="form-group">
                    <label>Email</label>
                    {{ form.email }}
                </div>

                <div class="form-group">
                    <label>Password</label>
                    {{ form.password1 }}
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    {{ form.password2 }}
                </div>

                <button type="submit" class="register-btn">
                    Register
                </button>
            </form>

            <div class="footer-text">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        © 2026 Shopping App — Built with Django
    </footer>

</body>
</html>
