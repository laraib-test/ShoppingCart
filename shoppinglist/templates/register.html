{% extends "shoppinglist/base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="flex justify-center items-center min-h-[80vh]">

    <div class="card w-full max-w-xl bg-base-100 shadow-2xl">

        <div class="card-body p-10">

            <h1 class="text-4xl font-bold text-center mb-8">
                Create Account
            </h1>

            <form method="post">

                {% csrf_token %}

                <!-- USERNAME -->
                <div class="form-control mb-5">

                    <label class="label">
                        <span class="label-text font-semibold">
                            Username
                        </span>
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        class="input input-bordered w-full"
                        required
                    >

                </div>

                <!-- EMAIL -->
                <div class="form-control mb-5">

                    <label class="label">
                        <span class="label-text font-semibold">
                            Email
                        </span>
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email"
                        class="input input-bordered w-full"
                        required
                    >

                </div>

                <!-- PASSWORD -->
                <div class="form-control mb-5">

                    <label class="label">
                        <span class="label-text font-semibold">
                            Password
                        </span>
                    </label>

                    <input
                        type="password"
                        name="password1"
                        placeholder="Enter password"
                        class="input input-bordered w-full"
                        required
                    >

                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="form-control mb-8">

                    <label class="label">
                        <span class="label-text font-semibold">
                            Confirm Password
                        </span>
                    </label>

                    <input
                        type="password"
                        name="password2"
                        placeholder="Confirm password"
                        class="input input-bordered w-full"
                        required
                    >

                </div>

                <!-- BUTTON -->
                <button
                    type="submit"
                    class="btn btn-primary w-full text-lg"
                >
                    Register
                </button>

            </form>

            <p class="text-center mt-6">

                Already have an account?

                <a
                    href="{% url 'login' %}"
                    class="text-primary font-semibold"
                >
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
