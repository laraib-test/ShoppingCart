{% extends "shoppinglist/base.html" %}

{% block title %}
Delete Product
{% endblock %}

{% block content %}

<div class="flex justify-center items-center min-h-[70vh]">

    <div class="card bg-base-100 shadow-2xl w-full max-w-2xl">

        <div class="card-body text-center p-10">

            <!-- TITLE -->
            <h1 class="text-4xl font-bold text-error mb-4">
                Delete Product
            </h1>

            <!-- MESSAGE -->
            <p class="text-lg text-gray-600 mb-8">
                Are you sure you want to delete this product?
            </p>

            <!-- PRODUCT NAME -->
            <h2 class="text-3xl font-bold mb-10">
                {{ object.name }}
            </h2>

            <!-- BUTTONS -->
            <div class="flex justify-center gap-6">

                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-error text-white px-8"
                    >
                        Yes, Delete
                    </button>

                </form>

                <a
                    href="{% url 'product_list' %}"
                    class="btn btn-outline px-8"
                >
                    Cancel
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
