{% extends "shoppinglist/base.html" %}

{% block title %}
Delete Product
{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto py-12 px-4">

    <div class="card bg-base-100 shadow-2xl border border-base-300">

        <div class="card-body text-center">

            <!-- ICON -->

            <div class="text-6xl mb-4">

                ⚠️

            </div>

            <!-- TITLE -->

            <h1 class="text-4xl font-bold text-error">

                Delete Product

            </h1>

            <!-- MESSAGE -->

            <p class="text-lg text-base-content/70 mt-4">

                Are you sure you want to delete

            </p>

            <h2 class="text-2xl font-bold mt-2">

                "{{ object.name }}"

            </h2>

            <!-- PRODUCT IMAGE -->

            {% if object.image %}

                <div class="flex justify-center mt-6">

                    <img
                        src="{{ object.image.url }}"
                        alt="{{ object.name }}"
                        class="w-40 h-40 object-contain rounded-2xl border bg-white p-3 shadow"
                    >

                </div>

            {% endif %}

            <!-- ACTIONS -->

            <form
                method="post"
                class="mt-8"
            >

                {% csrf_token %}

                <div class="flex justify-center gap-4">

                    <button
                        type="submit"
                        class="btn btn-error text-white"
                    >
                        🗑 Yes, Delete
                    </button>

                    <a
                        href="{% url 'product_list' %}"
                        class="btn btn-outline"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
